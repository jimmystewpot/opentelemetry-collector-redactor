name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  fmt:
    name: Check Go Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: processor/onnxredactionprocessor/go.mod
          cache: false

      - name: Verify code formatting
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following files are not properly formatted:"
            echo "$UNFORMATTED"
            exit 1
          fi

  lint:
    name: Run Linters
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: processor/onnxredactionprocessor/go.mod
          cache-dependency-path: processor/onnxredactionprocessor/go.sum

      - name: Cache ONNX Runtime
        id: cache-ort
        uses: actions/cache@v4
        with:
          path: .ort
          key: ort-1.31.0-${{ runner.os }}-${{ runner.arch }}

      - name: Download ONNX Runtime
        if: steps.cache-ort.outputs.cache-hit != 'true'
        run: make download-ort

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0

      - name: Validate Australian English & Run Linters
        run: |
          PYTHONPATH=scripts python3 scripts/test_validate_australian_english.py
          make lint

  test:
    name: Unit & Race Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: processor/onnxredactionprocessor/go.mod
          cache-dependency-path: processor/onnxredactionprocessor/go.sum

      - name: Cache ONNX Runtime
        id: cache-ort
        uses: actions/cache@v4
        with:
          path: .ort
          key: ort-1.31.0-${{ runner.os }}-${{ runner.arch }}

      - name: Download ONNX Runtime
        if: steps.cache-ort.outputs.cache-hit != 'true'
        run: make download-ort

      - name: Run test suite
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/.ort/lib
        run: make test
